<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .content {
            position: relative;
            z-index: 2;
            color: white;
            padding: 2rem;
            max-width: 600px;
            pointer-events: none;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            animation: fadeInUp 1s ease;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.2s both;
        }
        
        .social-links {
            display: flex;
            gap: 1rem;
            animation: fadeInUp 1s ease 0.4s both;
            pointer-events: auto;
        }
        
        .social-links a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        
        .social-links a:hover {
            background: rgba(255,255,255,0.2);
            border-color: white;
            transform: translateY(-2px);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .content { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="content">
        <h1>Alex Chen</h1>
        <p>Creative Developer & 3D Artist crafting immersive digital experiences. <br>Specializing in WebGL, Three.js, and interactive design.</p>
        <div class="social-links">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
            <a href="#">Behance</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- Import Three.js and create scene -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 2, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 3;
        controls.maxDistance = 15;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 10;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 15;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x4466ff, 0.8);
        fillLight.position.set(-3, 1, 2);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xff44aa, 0.5);
        backLight.position.set(0, 2, -5);
        scene.add(backLight);
        
        // Create a floating geometric centerpiece
        const centerGeo = new THREE.IcosahedronGeometry(1.2, 2);
        const centerMat = new THREE.MeshStandardMaterial({ 
            color: 0x4a6eff,
            emissive: 0x112244,
            roughness: 0.2,
            metalness: 0.7,
            wireframe: false,
            flatShading: false
        });
        const centerPiece = new THREE.Mesh(centerGeo, centerMat);
        centerPiece.castShadow = true;
        centerPiece.receiveShadow = true;
        centerPiece.position.y = 1.5;
        scene.add(centerPiece);
        
        // Add inner core
        const coreGeo = new THREE.IcosahedronGeometry(0.5, 1);
        const coreMat = new THREE.MeshStandardMaterial({ 
            color: 0xffaa44,
            emissive: 0x442200,
            roughness: 0.1,
            metalness: 0.3
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.castShadow = true;
        core.receiveShadow = true;
        centerPiece.add(core);
        
        // Add floating rings
        const ringGeo = new THREE.TorusGeometry(1.8, 0.05, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x112244 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.rotation.z = 0.3;
        ring.position.y = 1.5;
        ring.castShadow = true;
        ring.receiveShadow = true;
        scene.add(ring);
        
        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.03, 16, 100), 
            new THREE.MeshStandardMaterial({ color: 0xff88aa, emissive: 0x221122 }));
        ring2.rotation.x = 1.2;
        ring2.rotation.y = 0.5;
        ring2.position.y = 1.5;
        ring2.castShadow = true;
        ring2.receiveShadow = true;
        scene.add(ring2);
        
        // Floating cubes around
        const colors = [0xff4466, 0x44ff66, 0x4466ff, 0xffaa44, 0xaa44ff];
        for (let i = 0; i < 12; i++) {
            const size = 0.2 + Math.random() * 0.3;
            const cubeGeo = new THREE.BoxGeometry(size, size, size);
            const cubeMat = new THREE.MeshStandardMaterial({ 
                color: colors[Math.floor(Math.random() * colors.length)],
                emissive: 0x111122
            });
            const cube = new THREE.Mesh(cubeGeo, cubeMat);
            
            const angle = (i / 12) * Math.PI * 2;
            const radius = 3.2;
            const height = 1 + Math.sin(angle * 3) * 1.2;
            
            cube.position.set(
                Math.cos(angle) * radius,
                height,
                Math.sin(angle) * radius
            );
            
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
        }
        
        // Particle system
        const particleCount = 2000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount; i++) {
            const r = 5 + Math.random() * 8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            particlePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
            particlePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            particlePositions[i*3+2] = r * Math.cos(phi);
        }
        
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ 
            color: 0x88aaff,
            size: 0.08,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // Add subtle grid floor
        const gridHelper = new THREE.GridHelper(15, 20, 0x4466ff, 0x224488);
        gridHelper.position.y = -0.2;
        scene.add(gridHelper);
        
        // Animation
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate centerpiece
            centerPiece.rotation.x += 0.003;
            centerPiece.rotation.y += 0.005;
            
            // Rotate rings
            ring.rotation.y += 0.002;
            ring.rotation.x += 0.001;
            ring2.rotation.y -= 0.0015;
            ring2.rotation.z += 0.001;
            
            // Rotate particles
            particles.rotation.y += 0.0002;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
